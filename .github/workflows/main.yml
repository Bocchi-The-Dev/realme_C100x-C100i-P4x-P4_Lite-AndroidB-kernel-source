name: Build Kernel

on:
  workflow_dispatch:
  push:
    branches: [ master, main, 5.15-gki, dev ]

jobs:
  build:
    runs-on: ubuntu-22.04
    # NOTE: the `env` context is NOT available inside jobs.<id>.env expressions,
    # so CLANG_DIR below is a plain string, and the run scripts hardcode the
    # same literal path/version rather than referencing ${{ env.* }}.
    env:
      CLANG_VERSION: r450784e
      CLANG_DIR: /tmp/clang-r450784e
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y flex bison bc cpio libssl-dev libelf-dev \
            libncurses-dev zlib1g-dev libyaml-dev lz4 zstd device-tree-compiler \
            python3 rsync kmod dwarves zip unzip

      # The tree pins clang-r450784e (build.config.constants).  This mirror is
      # the same prebuilt the vendored build_5.15.sh uses.  NOTE: the tarball is
      # flat at the root (bin/clang, NOTICE, ...) with NO leading directory, so
      # do NOT use --strip-components (doing so mangles bin/ away and the job
      # silently falls back to the system clang).
      - name: Fetch clang-r450784e
        run: |
          curl -sSL -o /tmp/clang.tar.gz \
            "https://github.com/ravindu644/Android-Kernel-Tutorials/releases/download/toolchains/clang-r450784e.tar.gz"
          mkdir -p "${CLANG_DIR}"
          tar xzf /tmp/clang.tar.gz -C "${CLANG_DIR}"
          echo "${CLANG_DIR}/bin" >> "$GITHUB_PATH"
          test -x "${CLANG_DIR}/bin/clang" || { echo "clang missing after extract"; exit 1; }
          test -x "${CLANG_DIR}/bin/ld.lld" || { echo "ld.lld missing after extract"; exit 1; }

      - name: Show toolchain
        run: |
          export PATH="${CLANG_DIR}/bin:${PATH}"
          clang --version
          ld.lld --version
          # Guard against silently building with the runner's system clang.
          which clang | grep -q "${CLANG_DIR}" || { echo "WRONG clang on PATH"; exit 1; }

      # Use the vendor's own ums9230 config pairing: gki_defconfig (GKI 2.0 base)
      # merged with sprd_gki_sharkl6.fragment (the fragment the vendor's
      # build.config.gki.aarch64.ums9230_* uses for this SoC).  It sets
      # CONFIG_ARM_SPRD_CPUFREQ_V2=m -- the TEE DVFS driver as a MODULE, which
      # is the configuration that boots (built-in =y wedges the boot before USB).
      # The DTS side is a different family name for the same SoC gen: our board
      # is qogirl6, which is the branch of arch/arm64/boot/dts/sprd/Makefile that
      # carries the ums9230-1h10 dtbo targets.  So BSP_BUILD_FAMILY=qogirl6.
      - name: Generate config
        run: |
          export PATH="${CLANG_DIR}/bin:${PATH}"
          # merge_config.sh -O requires the output dir to already exist, else it
          # aborts with "output directory out does not exist".
          mkdir -p out
          ./scripts/kconfig/merge_config.sh -m -O out \
            arch/arm64/configs/gki_defconfig \
            arch/arm64/configs/sprd_gki_sharkl6.fragment \
            arch/arm64/configs/nova_ums9230.fragment
          make LLVM=1 LLVM_IAS=1 ARCH=arm64 O=out olddefconfig
          grep -E "CONFIG_ARM_SPRD_CPUFREQ_V2|CONFIG_ARCH_SPRD" out/.config
          # Full LTO OOM-kills the runner at the `LTO vmlinux.o` link; assert
          # we really got ThinLTO (and that CFI survived) before spending
          # ~20 min on a build that would die the same way again.
          grep -E "CONFIG_LTO_CLANG_THIN|CONFIG_LTO_CLANG_FULL|CONFIG_CFI_CLANG" out/.config
          # Assert the board-critical symbols really resolved.  merge_config.sh
          # + olddefconfig silently carry unknown CONFIG_* lines through into
          # .config, so grepping for a symbol's mere presence can be fooled by
          # a phantom line.  Check the _selected value_ instead -- these
          # decide whether the phone has a display at all.
          echo "=== board-critical config ==="
          for sym in UNISOC_DISP DRM_SPRD_DPU0 DRM_SPRD_DSI UNISOC_GSP \
                    ARM_SPRD_CPUFREQ_V2 TRUSTY_TUI TRUSTY_VIRTIO_IPC \
                    FUEL_GAUGE_SC27XX PSTORE_RAM PSTORE_CONSOLE PSTORE_PMSG \
                    PSTORE_DEFLATE_COMPRESS; do
            # Take the VALUE, not the whole line: grep returns
            # "CONFIG_X=m", which never matches a `case =m` pattern.
            val=$(grep -E "^CONFIG_${sym}=" out/.config | sed -E "s/^CONFIG_[A-Z0-9_]+=//")
            printf '  %-24s =%s\n' "$sym" "${val:-<absent>}"
            case "$val" in
              y|m) ;;
              *) echo "::error::CONFIG_${sym} did not resolve to y/m (got '${val:-absent}')"; exit 1;;
            esac
          done
          echo "kernelrelease: $(make LLVM=1 ARCH=arm64 O=out -s kernelrelease)"

      # The kernel Image is the main GKI deliverable and builds cleanly.
      - name: Build kernel Image
        run: |
          export PATH="${CLANG_DIR}/bin:${PATH}"
          make LLVM=1 LLVM_IAS=1 ARCH=arm64 O=out BSP_BUILD_FAMILY=qogirl6 \
            -j$(nproc) Image
          ls -la out/arch/arm64/boot/Image

      # DTB/DTBO.  arch/arm64/boot/dts/sprd/Makefile nests every family block
      # inside TWO further gates before the qogirl6 branch, so all three
      # variables are required.  Passing only BSP_BUILD_FAMILY fell through to
      # the "For UPSTREAM or AiAiAi" branch and built 4 unrelated DTBs.
      # These are reference artifacts only: the board's dtb/dtbo partitions are
      # empty and boot.img holds no FDT, so the live device tree is the stock
      # Transsion X6525 one and we never flash ours (the 1h10 overlay is the
      # realme reference board -- GC9305 SPI QVGA, not our nt36525b+td4160).
      # A DTB problem must therefore never block the Image artifact.
      - name: Build DTB/DTBO
        run: |
          export PATH="${CLANG_DIR}/bin:${PATH}"
          make LLVM=1 LLVM_IAS=1 ARCH=arm64 O=out \
            BSP_BUILD_DT_OVERLAY=y BSP_BUILD_ANDROID_OS=y BSP_BUILD_FAMILY=qogirl6 \
            -j$(nproc) dtbs || echo "WARN: dtbs failed (reference artifact only, continuing)"
          echo "=== ums9230 device tree artifacts (best effort) ==="
          for f in out/arch/arm64/boot/dts/sprd/ums9230-base.dtb \
                   out/arch/arm64/boot/dts/sprd/ums9230-1h10-overlay.dtbo; do
            if [ -e "$f" ]; then ls -la "$f"; else echo "  MISSING $f"; fi
          done

      # `make Image` builds vmlinux and the Image, but NOT any =m module.  Every
      # module the board actually loads at runtime is a module: sprd-cpufreq-v2
      # and sprd_sip_svc (loaded from the vendor_boot ramdisk), plus sprd-drm,
      # sprd-gsp, trusty/trusty-tui and sc27xx_fuel_gauge.  Without this step the
      # kernel has no loadable drivers at all and the screen stays black, so
      # this is the step that makes the artifact set flashable.
      - name: Build in-tree modules
        run: |
          export PATH="${CLANG_DIR}/bin:${PATH}"
          make LLVM=1 LLVM_IAS=1 ARCH=arm64 O=out -j$(nproc) modules
          echo "=== in-tree modules built ==="
          find out -name "*.ko" | wc -l
          find out -name "*.ko" -printf "%f\n" | sort | head -40

      # GKI 2.0 vendor modules (audio/display/gpu/input/touchscreen/wcn/...).
      #
      # Root cause of the previous "vendor modules: 0": kernel_modules/<subsystem>/
      # is only a CONTAINER.  None of audio, display, gpu, input, touchscreen,
      # wcn, video, vender, npu or nfc has a Makefile, so `make -C
      # kernel_modules/kernel5.15/audio` dies with "No targets specified and no
      # makefile found".  The real build units are the 188 leaf directories that
      # contain a Kbuild; 109 of those also carry the vendor's external-make
      # wrapper Makefile, and 79 are Kbuild-only.
      #
      # Each unit is built as a kbuild external module, which is what the vendor
      # wrapper does internally (it symlinks the Kbuild into BSP_MODULES_OUT and
      # calls `make -C BSP_KERNEL_PATH M=... src=... modules`).  We try the
      # vendor wrapper first where it exists and fall back to calling kbuild
      # directly, because the two disagree about how src= is threaded through
      # and we would rather ship modules than argue about it.  Failures are
      # counted and listed, not swallowed: a silent "|| echo WARN" hid a total
      # failure for two runs.
      # GKI 2.0 vendor modules (audio/display/gpu/input/touchscreen/wcn/...).
      # See ci/build-vendor-modules.sh for why this is a script: the subsystem
      # directories are containers, not build units, so the 213 real units are
      # the leaf directories holding a Kbuild.  It runs them in parallel and
      # prints one line per unit, because a 6-minute step with no output reads
      # as a hang, and it times out each unit so one wedged build cannot stall
      # the job.  Failures are counted and named, never swallowed.
      - name: Build vendor modules (kernel_modules)
        run: |
          export PATH="${CLANG_DIR}/bin:${PATH}"
          KSRC="${GITHUB_WORKSPACE}" \
          KBUILD="${GITHUB_WORKSPACE}/out" \
          MODOUT="${GITHUB_WORKSPACE}/out/vendor_modules" \
          JOBS="$(nproc)" \
          UNIT_TIMEOUT=300 \
            ./ci/build-vendor-modules.sh

      - name: Package artifacts
        run: |
          mkdir -p pkg/boot-Image pkg/dtb pkg/modules-intree pkg/modules-vendor
          cp out/arch/arm64/boot/Image pkg/boot-Image/ 2>/dev/null || true
          find out/arch/arm64/boot/dts -name "ums9230-base.dtb" \
            -exec cp {} pkg/dtb/ \; 2>/dev/null || true
          find out/arch/arm64/boot/dts -name "ums9230-1h10-overlay.dtbo" \
            -exec cp {} pkg/dtb/ \; 2>/dev/null || true
          # In-tree =m modules: these are the ones the board loads at runtime.
          # Exclude out/vendor_modules -- the previous step stages its output
          # under out/, so a bare `find out -name '*.ko'` swept the vendor
          # modules in here too and double-counted them (252 reported against
          # 174 actual in-tree modules).
          find out -name "*.ko" -not -path "out/vendor_modules/*" \
            -exec cp --parents {} pkg/modules-intree/ \; 2>/dev/null || true
          # Out-of-tree kernel_modules/ set, as built by the step above (the
          # vendor wrapper stages them under out/vendor_modules/<name>/, and the
          # direct kbuild fallback drops them beside their source dir).
          find out/vendor_modules -name "*.ko" -exec cp --parents {} pkg/modules-vendor/ \; 2>/dev/null || true
          find kernel_modules -name "*.ko" -exec cp --parents {} pkg/modules-vendor/ \; 2>/dev/null || true
          # Per-unit build logs.  Without these a failed vendor unit is
          # unattributable: we learn only that a unit failed, never why.
          mkdir -p pkg/vendor-logs
          find out/vendor_modules -maxdepth 1 -name "*.log" \
            -exec cp {} pkg/vendor-logs/ \; 2>/dev/null || true
          # config snapshot for reference/debug
          cp out/.config pkg/ 2>/dev/null || cp .config pkg/ 2>/dev/null || true
          echo "=== pkg contents ==="
          echo "in-tree modules: $(find pkg/modules-intree -name '*.ko' | wc -l)"
          echo "vendor modules : $(find pkg/modules-vendor  -name '*.ko' | wc -l)"
          du -sh pkg

      # Does our module set actually satisfy the X6525's loader?
      #
      # The stock /vendor/lib/modules/modules.load names 133 modules in
      # insmod order, but those are 5.4 modules: vermagic
      # "5.4.210-...-ab665 ... modversions" with CONFIG_MODVERSIONS=y, so their
      # symbol CRCs belong to that kernel and they cannot load against a 5.15
      # Image under any circumstances.  Replacing /lib/modules is mandatory,
      # which makes the rewritten load list a real deliverable rather than an
      # afterthought -- and this step is how we know what it must contain.
      #
      # Deliberately NOT `continue-on-error`.  An earlier version of the vendor
      # step reported success while producing nothing loadable, and the lesson
      # was that absence of signal must not read as progress.
      - name: Check module coverage vs X6525 loader
        run: |
          ./ci/check-module-coverage.sh ci/modules.load.stock \
            pkg/modules-intree pkg/modules-vendor

      - name: Upload Image
        uses: actions/upload-artifact@v4
        with:
          name: Image-${{ github.sha }}
          path: pkg/boot-Image/
          if-no-files-found: error

      - name: Upload DTB/DTBO
        uses: actions/upload-artifact@v4
        with:
          name: dtb-${{ github.sha }}
          path: pkg/dtb/
          if-no-files-found: warn

      - name: Upload in-tree modules
        uses: actions/upload-artifact@v4
        with:
          name: modules-intree-${{ github.sha }}
          path: pkg/modules-intree/
          if-no-files-found: warn

      - name: Upload vendor modules
        uses: actions/upload-artifact@v4
        with:
          name: modules-vendor-${{ github.sha }}
          path: pkg/modules-vendor/
          if-no-files-found: warn

      # Per-unit build logs for the vendor modules.  Without these, a failed unit
      # is unattributable -- we learn only that it failed, never why.
      - name: Upload vendor module build logs
        uses: actions/upload-artifact@v4
        with:
          name: vendor-logs-${{ github.sha }}
          path: pkg/vendor-logs/
          if-no-files-found: warn

      - name: Upload config
        uses: actions/upload-artifact@v4
        with:
          name: config-${{ github.sha }}
          path: pkg/.config
          if-no-files-found: warn
